<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>扫码 - zeco</title>

    <script>
        (function () {
            try {
                var saved = localStorage.getItem('zeco-theme');
                var prefersDark = window.matchMedia
                    && window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>

    <style>
        :root {
            color-scheme: light;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: rgba(79, 70, 229, 0.1);
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --surface-solid: #ffffff;
            --surface-soft: #f9fafb;
            --surface-muted: #f3f4f6;
            --surface-hover: #eef2ff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --text-mute: #9ca3af;
            --text-success: #059669;
            --text-error: #dc2626;
            --border-color: #e5e7eb;
            --border-strong: #d1d5db;
            --divider: #cbd5e1;
            --police-icon: #94a3b8;
            --toast-bg: #1f2937;
            --toast-text: #ffffff;
            --modal-mask-bg: rgba(17, 24, 39, 0.45);
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);

            /* ★ scanner 页卡片 600px 宽，主题按钮贴近卡片右上角 */
            --zeco-theme-btn-right: max(16px, calc(50% - 300px - 56px));
        }
        html[data-theme="dark"] {
            color-scheme: dark;
            --primary: #818cf8;
            --primary-hover: #a5b4fc;
            --primary-soft: rgba(129, 140, 248, 0.18);
            --bg-gradient: linear-gradient(135deg, #0b1220 0%, #1e293b 100%);
            --glass-bg: rgba(30, 41, 59, 0.92);
            --surface-solid: #1e293b;
            --surface-soft: #0f172a;
            --surface-muted: #334155;
            --surface-hover: rgba(129, 140, 248, 0.15);
            --text-main: #e2e8f0;
            --text-sub: #a8b5c8;
            --text-mute: #7c8ba1;
            --text-success: #34d399;
            --text-error: #f87171;
            --border-color: #334155;
            --border-strong: #475569;
            --divider: #4b5b70;
            --police-icon: #64748b;
            --toast-bg: #f1f5f9;
            --toast-text: #0f172a;
            --modal-mask-bg: rgba(0, 0, 0, 0.65);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 84px 20px 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* ============ 顶部导航 ============ */
        .top-nav {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            box-shadow: var(--shadow);
            z-index: 80;
        }
        .nav-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 50px;
            text-decoration: none;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-item:hover { color: var(--primary); }
        .nav-item.active { background: var(--primary); color: #fff; }
        .nav-icon { width: 16px; height: 16px; fill: currentColor; display: block; }
        @media (max-width: 420px) {
            .nav-item { padding: 8px 12px; }
            .nav-item span { display: none; }
            .top-nav { gap: 2px; }
        }

        /* ============ 卡片 ============ */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card h2 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card .subtitle {
            font-size: 0.8rem;
            color: var(--text-mute);
            margin-bottom: 16px;
            text-align: center;
        }
        .icon { width: 22px; height: 22px; fill: currentColor; }

        /* ============ 视频区 ============ */
        .video-wrap {
            position: relative;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 1/1;
            max-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video { width: 100%; height: 100%; object-fit: cover; display: block; }
        #snapshot {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        #snapshot.show { display: block; }
        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60%;
            height: 60%;
            transform: translate(-50%, -50%);
            border: 3px solid var(--primary);
            border-radius: 16px;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            transition: border-color 0.2s;
        }
        .scan-line {
            position: absolute;
            left: 5%;
            right: 5%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: scanMove 2s linear infinite;
            border-radius: 2px;
        }
        .video-wrap.done .scan-line { display: none; }
        .video-wrap.done .scan-frame {
            border-color: var(--text-success);
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.45);
        }
        @keyframes scanMove {
            0%   { top: 20%; }
            100% { top: 80%; }
        }

        .status {
            margin-top: 16px;
            font-size: 0.95rem;
            color: var(--text-sub);
            text-align: center;
            min-height: 24px;
            line-height: 1.5;
        }
        .status.error   { color: var(--text-error); font-weight: 600; }
        .status.success { color: var(--text-success); font-weight: 600; }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            transition: all 0.2s;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn.ghost {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn.ghost:hover { background: var(--primary-soft); }

        .result-area {
            margin-top: 20px;
            padding: 15px;
            background: var(--surface-muted);
            border-radius: 12px;
            text-align: center;
            display: none;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }
        .result-area.show { display: block; }
        .result-area .success-tip {
            font-weight: bold;
            color: var(--text-success);
            margin-bottom: 4px;
        }
        .result-time {
            font-size: 0.8rem;
            color: var(--text-mute);
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }
        .result-text {
            word-break: break-all;
            font-family: monospace;
            background: var(--surface-solid);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-top: 10px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .card { padding: 18px; }
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <nav class="top-nav">
        <a href="index.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM3 13h6v6H3v-6zm2 2v2h2v-2H5zm13-2h3v2h-3v-2zm-3 0h2v2h-2v-2zm3 3h3v3h-3v-3zm-3 3h2v2h-2v-2zm-3-3h2v2h-2v-2z"/>
            </svg>
            <span>二维码</span>
        </a>
        <a href="scanner.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7V4a1 1 0 011-1h3v2H5v2H3zm16-3a1 1 0 011 1v3h-2V5h-2V3h3zM3 17v3a1 1 0 001 1h3v-2H5v-2H3zm16 2v2h2a1 1 0 001-1v-3h-2v2h-1zM5 11h14v2H5v-2z"/>
            </svg>
            <span>扫码</span>
        </a>
    </nav>

    <div class="card">
        <h2>
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM3 13h6v6H3v-6zm2 2v2h2v-2H5zm13-2h3v2h-3v-2zm-3 0h2v2h-2v-2zm3 3h3v3h-3v-3zm-3 3h2v2h-2v-2zm-3-3h2v2h-2v-2z"/></svg>
            摄像头扫码
        </h2>
        <div class="subtitle">支持二维码 / EAN-13 / Code 128 / UPC 等常见格式</div>

        <div class="video-wrap" id="video-wrap">
            <video id="video" playsinline webkit-playsinline muted autoplay></video>
            <img id="snapshot" alt="扫描结果快照">
            <div class="scan-frame"><div class="scan-line"></div></div>
        </div>

        <div id="status" class="status">正在启动摄像头…</div>
        <button id="switch-btn" class="btn" onclick="switchCamera()" style="display:none;">切换摄像头</button>

        <div id="result-area" class="result-area">
            <div class="success-tip">识别成功</div>
            <div id="result-time" class="result-time"></div>
            <div id="result-text" class="result-text"></div>
            <button class="btn" onclick="copyResult()" style="background:#6366f1;">复制结果</button>
            <button class="btn ghost" onclick="restartScan()">重新扫描</button>
        </div>
    </div>

    <!-- 通用组件：页脚 / 模态框 / Toast / 主题按钮 -->
    <script src="lib/footer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        /* 导航：点击当前页不重载 */
        document.querySelectorAll('.nav-item').forEach(function (item) {
            item.addEventListener('click', function (e) {
                if (this.classList.contains('active')) e.preventDefault();
            });
        });

        const video = document.getElementById('video');
        const snapshot = document.getElementById('snapshot');
        const videoWrap = document.getElementById('video-wrap');
        const statusEl = document.getElementById('status');
        const resultArea = document.getElementById('result-area');
        const resultText = document.getElementById('result-text');
        const resultTime = document.getElementById('result-time');
        const switchBtn = document.getElementById('switch-btn');

        let stream = null;
        let currentFacingMode = 'environment';
        let scanning = false;
        let rafId = null;

        function setStatus(msg, type) {
            statusEl.innerText = msg;
            statusEl.className = 'status' + (type ? ' ' + type : '');
        }

        function formatTime(d) {
            const pad = (n) => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        }

        async function startCamera() {
            stopCamera();

            video.style.display = 'block';
            snapshot.classList.remove('show');
            snapshot.removeAttribute('src');
            videoWrap.classList.remove('done');

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                setStatus('当前浏览器不支持摄像头 API，请改用 Chrome / Safari / Edge 等现代浏览器', 'error');
                return;
            }
            if (!window.isSecureContext) {
                setStatus('⚠️ 当前页面不是安全上下文（HTTPS），手机通过 IP 访问时必须使用 HTTPS', 'error');
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: {
                        facingMode: currentFacingMode,
                        width:  { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                video.srcObject = stream;
                await video.play();
                setStatus('请将二维码对准扫描框');
                switchBtn.style.display = 'flex';
                scanning = true;
                requestAnimationFrame(scanLoop);
            } catch (err) {
                let msg = '无法访问摄像头：';
                switch (err.name) {
                    case 'NotAllowedError':  msg += '用户拒绝了权限，请在浏览器设置中允许访问摄像头'; break;
                    case 'NotFoundError':    msg += '未找到摄像头设备'; break;
                    case 'NotReadableError': msg += '摄像头被其他程序占用，请关闭其他应用后重试'; break;
                    case 'SecurityError':    msg += '必须使用 HTTPS 访问'; break;
                    default:                 msg += (err.message || err.name) + '。手机通过 IP 访问请确保使用 HTTPS';
                }
                setStatus(msg, 'error');
            }
        }

        function stopCamera() {
            scanning = false;
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            video.srcObject = null;
        }

        async function switchCamera() {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            await startCamera();
        }

        function scanLoop() {
            if (!scanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = scanLoop._canvas || (scanLoop._canvas = document.createElement('canvas'));
                const w = video.videoWidth;
                const h = video.videoHeight;

                if (w && h) {
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(video, 0, 0, w, h);
                    const imageData = ctx.getImageData(0, 0, w, h);
                    const code = jsQR(imageData.data, w, h, { inversionAttempts: 'dontInvert' });
                    if (code && code.data) {
                        onDecodeSuccess(code.data, canvas);
                        return;
                    }
                }
            }
            rafId = requestAnimationFrame(scanLoop);
        }

        function onDecodeSuccess(text, canvas) {
            scanning = false;
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

            if (canvas) {
                try {
                    snapshot.src = canvas.toDataURL('image/jpeg', 0.85);
                    snapshot.classList.add('show');
                    video.style.display = 'none';
                    videoWrap.classList.add('done');
                } catch (e) {}
            }

            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            video.srcObject = null;

            setStatus('识别成功！', 'success');
            resultText.innerText = text;
            resultTime.innerText = '扫描时间：' + formatTime(new Date());
            resultArea.classList.add('show');

            if (navigator.vibrate) navigator.vibrate(100);
            Zeco.showToast('识别成功');
        }

        function restartScan() {
            resultArea.classList.remove('show');
            resultText.innerText = '';
            resultTime.innerText = '';
            startCamera();
        }

        function copyResult() {
            const text = resultText.innerText;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(
                    () => Zeco.showToast('已复制到剪贴板'),
                    () => fallbackCopy(text)
                );
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                Zeco.showToast('已复制到剪贴板');
            } catch {
                Zeco.showToast('复制失败，请手动选择文本');
            }
            document.body.removeChild(ta);
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                scanning = false;
                if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
                if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
                video.srcObject = null;
            } else if (!resultArea.classList.contains('show')) {
                startCamera();
            }
        });

        startCamera();
    </script>
</body>
</html>
