<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>极速二维码工具 - zeco</title>

    <script>
        (function () {
            try {
                var saved = localStorage.getItem('zeco-theme');
                var prefersDark = window.matchMedia
                    && window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>

    <style>
        :root {
            color-scheme: light;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: rgba(79, 70, 229, 0.1);
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --surface-solid: #ffffff;
            --surface-soft: #f9fafb;
            --surface-muted: #f3f4f6;
            --surface-hover: #eef2ff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --text-mute: #9ca3af;
            --text-success: #059669;
            --border-color: #e5e7eb;
            --border-strong: #d1d5db;
            --divider: #cbd5e1;
            --police-icon: #94a3b8;
            --toast-bg: #1f2937;
            --toast-text: #ffffff;
            --modal-mask-bg: rgba(17, 24, 39, 0.45);
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --input-min-height: 132px;
        }
        html[data-theme="dark"] {
            color-scheme: dark;
            --primary: #818cf8;
            --primary-hover: #a5b4fc;
            --primary-soft: rgba(129, 140, 248, 0.18);
            --bg-gradient: linear-gradient(135deg, #0b1220 0%, #1e293b 100%);
            --glass-bg: rgba(30, 41, 59, 0.92);
            --surface-solid: #1e293b;
            --surface-soft: #0f172a;
            --surface-muted: #334155;
            --surface-hover: rgba(129, 140, 248, 0.15);
            --text-main: #e2e8f0;
            --text-sub: #a8b5c8;
            --text-mute: #7c8ba1;
            --text-success: #34d399;
            --border-color: #334155;
            --border-strong: #475569;
            --divider: #4b5b70;
            --police-icon: #64748b;
            --toast-bg: #f1f5f9;
            --toast-text: #0f172a;
            --modal-mask-bg: rgba(0, 0, 0, 0.65);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 84px 20px 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* ============ 顶部导航 ============ */
        .top-nav {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            box-shadow: var(--shadow);
            z-index: 80;
        }
        .nav-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 50px;
            text-decoration: none;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-item:hover { color: var(--primary); }
        .nav-item.active { background: var(--primary); color: #fff; }
        .nav-icon { width: 16px; height: 16px; fill: currentColor; display: block; }
        @media (max-width: 420px) {
            .nav-item { padding: 8px 12px; }
            .nav-item span { display: none; }
            .top-nav { gap: 2px; }
        }

        /* ============ 布局 ============ */
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
        }
        .header h1 {
            font-size: 1.8rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: start;
        }
        @media (min-width: 768px) {
            .container { grid-template-columns: 1fr 1fr; }
        }
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            background: var(--surface-soft);
            color: var(--text-main);
            resize: vertical;
        }
        textarea::placeholder { color: var(--text-mute); }
        textarea:focus {
            border-color: var(--primary);
            background: var(--surface-solid);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }
        #gen-input { min-height: var(--input-min-height); }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:disabled {
            background: var(--border-strong);
            cursor: not-allowed;
            transform: none;
            opacity: 0.7;
        }

        .upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--surface-soft);
            position: relative;
            overflow: hidden;
            min-height: var(--input-min-height);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .upload-zone:hover { border-color: var(--primary); background: var(--surface-hover); }
        .upload-zone input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        .upload-icon { width: 40px; height: 40px; color: var(--text-mute); margin-bottom: 10px; }
        .upload-tip { color: var(--text-sub); }
        .preview-img { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 10px; display: none; }

        .result-area {
            margin-top: 20px;
            padding: 15px;
            background: var(--surface-muted);
            border-radius: 12px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .result-area img { max-width: 100%; border-radius: 8px; }
        .result-text {
            word-break: break-all;
            font-family: monospace;
            background: var(--surface-solid);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-top: 10px;
            text-align: left;
        }
        .success-tip { font-weight: bold; color: var(--text-success); margin-bottom: 5px; }

        .icon { width: 20px; height: 20px; fill: currentColor; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .spinner {
            width: 18px; height: 18px; border: 2px solid #ffffff; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.8s linear infinite; display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <nav class="top-nav">
        <a href="index.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM3 13h6v6H3v-6zm2 2v2h2v-2H5zm13-2h3v2h-3v-2zm-3 0h2v2h-2v-2zm3 3h3v3h-3v-3zm-3 3h2v2h-2v-2zm-3-3h2v2h-2v-2z"/>
            </svg>
            <span>二维码</span>
        </a>
        <a href="scanner.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7V4a1 1 0 011-1h3v2H5v2H3zm16-3a1 1 0 011 1v3h-2V5h-2V3h3zM3 17v3a1 1 0 001 1h3v-2H5v-2H3zm16 2v2h2a1 1 0 001-1v-3h-2v2h-1zM5 11h14v2H5v-2z"/>
            </svg>
            <span>扫码</span>
        </a>
    </nav>

    <div class="header">
        <h1>
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 3h6v6H3V3zm2 2v2h2V5H5zm8-2h6v6h-6V3zm2 2v2h2V5h-2zM3 13h6v6H3v-6zm2 2v2h2v-2H5zm13-2h3v2h-3v-2zm-3 0h2v2h-2v-2zm3 3h3v3h-3v-3zm-3 3h2v2h-2v-2zm-3-3h2v2h-2v-2z"/></svg>
            zeco
        </h1>
    </div>

    <div class="container">
        <!-- 生成模块 -->
        <div class="card">
            <label for="gen-input">输入内容生成二维码</label>
            <textarea id="gen-input" rows="4" placeholder="请输入网址或文本..."></textarea>
            <button onclick="generateQR()" id="gen-btn">
                <span class="btn-text">立即生成</span>
                <div class="spinner"></div>
            </button>

            <div id="qr-result" class="result-area">
                <img id="qr-img" src="" alt="生成的二维码图片">
                <button onclick="downloadQR()" style="margin-top:10px; background:#10b981;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    保存图片
                </button>
            </div>
        </div>

        <!-- 识别模块 -->
        <div class="card">
            <label>上传图片识别二维码</label>
            <div class="upload-zone" id="drop-zone">
                <input type="file" id="file-input" accept="image/*">
                <div id="upload-hint">
                    <svg class="icon upload-icon" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    <p class="upload-tip">点击或拖拽上传</p>
                </div>
                <img id="preview-img" class="preview-img" alt="预览图">
            </div>
            <button onclick="decodeQR()" id="decode-btn" disabled>
                <span class="btn-text">开始识别</span>
                <div class="spinner"></div>
            </button>

            <div id="decode-result" class="result-area">
                <div class="success-tip">识别成功</div>
                <div id="decode-text" class="result-text"></div>
                <button onclick="copyText()" style="margin-top:10px;background:#6366f1;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    复制结果
                </button>
            </div>
        </div>
    </div>

    <!-- 通用组件：页脚 / 模态框 / Toast / 主题按钮 -->
    <script src="lib/footer.js"></script>

    <script>
        /* 导航：点击当前页不重载 */
        document.querySelectorAll('.nav-item').forEach(function (item) {
            item.addEventListener('click', function (e) {
                if (this.classList.contains('active')) e.preventDefault();
            });
        });

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobile) {
            document.getElementById('upload-hint').innerHTML = '<p class="upload-tip">点击拍摄或选择相册</p>';
        }

        async function generateQR() {
            const content = document.getElementById('gen-input').value.trim();
            if (!content) return Zeco.showToast('请输入内容');

            const btn = document.getElementById('gen-btn');
            const spinner = btn.querySelector('.spinner');
            const text = btn.querySelector('.btn-text');

            btn.disabled = true;
            spinner.style.display = 'block';
            text.style.display = 'none';

            try {
                const res = await fetch(`/api/generate?content=${encodeURIComponent(content)}`);
                if (!res.ok) throw new Error('生成失败');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);

                const img = document.getElementById('qr-img');
                img.src = url;
                document.getElementById('qr-result').style.display = 'block';
            } catch (e) {
                Zeco.showToast('网络错误，请检查服务');
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                text.style.display = 'block';
            }
        }

        function downloadQR() {
            const a = document.createElement('a');
            a.href = document.getElementById('qr-img').src;
            a.download = `qrcode_${Date.now()}.png`;
            a.click();
        }

        const fileInput = document.getElementById('file-input');
        const previewImg = document.getElementById('preview-img');
        const uploadHint = document.getElementById('upload-hint');
        const decodeBtn = document.getElementById('decode-btn');
        let currentFile = null;

        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) return Zeco.showToast('图片不能超过2MB');

            currentFile = file;
            const reader = new FileReader();
            reader.onload = function (ev) {
                previewImg.src = ev.target.result;
                previewImg.style.display = 'block';
                uploadHint.style.display = 'none';
                decodeBtn.disabled = false;
                document.getElementById('decode-result').style.display = 'none';
            };
            reader.readAsDataURL(file);
        });

        async function decodeQR() {
            if (!currentFile) return;

            const btn = document.getElementById('decode-btn');
            const spinner = btn.querySelector('.spinner');
            const text = btn.querySelector('.btn-text');

            btn.disabled = true;
            spinner.style.display = 'block';
            text.style.display = 'none';

            const formData = new FormData();
            formData.append('qrimage', currentFile);

            try {
                const res = await fetch('/api/decode', { method: 'POST', body: formData });
                if (!res.ok) {
                    const err = await res.text();
                    throw new Error(err);
                }
                const result = await res.text();
                document.getElementById('decode-text').innerText = result;
                document.getElementById('decode-result').style.display = 'block';
            } catch (e) {
                Zeco.showToast(e.message.includes('识别') ? '未识别到二维码' : '服务器错误');
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                text.style.display = 'block';
            }
        }

        function copyText() {
            const text = document.getElementById('decode-text').innerText;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => Zeco.showToast('已复制到剪贴板'))
                    .catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                Zeco.showToast('已复制到剪贴板');
            } catch {
                Zeco.showToast('复制失败，请手动选中');
            }
            document.body.removeChild(ta);
        }
    </script>
</body>
</html>
